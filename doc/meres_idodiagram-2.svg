       x="297"
       y="571"
       font-size="12"
       id="text59">s1 = S1 − base1</text>
    <text
       x="297"
       y="588"
       font-size="11"
       fill="#555"
       id="text60">base: nullázáskor mért</text>
    <text
       x="297"
       y="601"
       font-size="11"

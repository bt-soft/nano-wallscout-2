       x="489"
       y="552"
       font-weight="bold"
       id="text62">csúcs-megtartás</text>
    <text
       x="489"
       y="571"
       font-size="12"
       id="text63">|s1| → peak</text>
    <text
       x="489"
       y="588"
       font-size="11"
       fill="#555"
       id="text64">tart 1,5 s, majd 1 s alatt</text>
    <text

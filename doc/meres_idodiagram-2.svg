       font-size="12"
       id="text67">be: |s1| ≥ 4,0</text>
    <text
       x="681"
       y="588"
       font-size="12"
       id="text68">ki: |s1| &lt; 2,5</text>
    <text
       x="874"
       y="552"
       font-weight="bold"
       id="text69">kijelzés + hang</text>
    <text
       x="874"
       y="571"
       font-size="11"
       id="text70">shown = találat ? s1 : 0</text>
    <text
       x="874"
       y="586"
       font-size="11"
       id="text71">fém-jelleg: s1 előjele</text>
    <text
       x="874"
       y="601"

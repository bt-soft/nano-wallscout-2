  <text
     x="700"
     y="388"
     font-size="12px"
     id="text38"
     style="font-size:12px">A tS1 és tS2 is a TX <tspan
   style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:12px;font-family:'Segoe UI', Arial, sans-serif;-inkscape-font-specification:'Segoe UI, Arial, sans-serif, Bold';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal"
   id="tspan75">KIKAPCSOLÁSÁTÓL</tspan> számít,</text>
  <text
     x="700"
     y="404"
     font-size="12"
     id="text39">mindkettő ugyanabból a pillanatból indul.</text>
  <text
     x="700"
     y="424"
     font-size="12"
     id="text40">Mintavétel (Timer1): tp+tS1 = 100 µs,</text>
  <text
     x="700"
     y="440"
     font-size="12"
     id="text41">tp+tS2 = 120 µs. Feltétel: tS2 ≥ tS1+16 µs és</text>
  <text
     x="700"
     y="456"
     font-size="12"
     id="text42">tp+tS2+13+10 µs ≤ T (férjen a periódusba)</text>

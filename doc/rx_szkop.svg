     font-weight="bold"
     id="text1">Rx jelút (U2A/U2B/U2D) – alapérték: tp = 60 µs, f = 500 Hz; trigger: gate lefutó él (t = 0)</text>
  <text
     x="20"
     y="39"
     fill="#7fd99a"
     font-size="12"
     id="text32">T = 2 ms; a lecsengés részlete 20 µs/osztásban látható. A jelalakok szemléltetőek, nem mért adatok.</text>

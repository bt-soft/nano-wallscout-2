  <text
     x="170"
     y="388"
     fill="#1f2937"
     font-size="12"
     id="text33">• A TX-impulzus és az S1/S2 ADC-mintavételezés alatt a megszakítások tiltva vannak.</text>
  <text
     x="170"
     y="406"
     fill="#1f2937"
     font-size="12"
     id="text34">• Az S2-konverzió után, a periódus végéig a megszakítások engedélyezettek.</text>
  <text
     x="170"
     y="424"
     fill="#92400e"
     font-size="12"
     id="text35">• Minden 8 impulzus után lefut a buttonsUpdate(); ez késleltetheti a következő impulzust.</text>
  <text
     x="170"
     y="442"
     fill="#1f2937"
     font-size="12"
     id="text36">• Az S1- és S2-minták külön-külön 32-es átlaga adja a ciklus mérési eredményét.</text>
